name: Public test battery
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.14
        id: python314
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python 3.13 fallback if unavailable
        if: steps.python314.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record Python version
        run: python --version
      - name: Public test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
          python -m pip install 'pytest>=8,<10'
      - name: Reconstruct public base and run complete modules
        run: python -B .ci/run.py --shard '${{ matrix.shard }}' --work "$RUNNER_TEMP/nube"
