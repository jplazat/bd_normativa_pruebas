[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ict155-publico"
version = "0.0.0"
description = "Codigo de una base de normativa de metrologia legal con pruebas publicas"
requires-python = ">=3.14"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ict155*", "cowork*", "herramientas*", "datos*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.sql", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["pruebas", "cowork"]
addopts = "-p no:cacheprovider"
